<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive - PXR 2.0 wireframe</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/app.js"></script>
</head>
<body>
  <div class="layout">
    <nav class="side" data-active="archive" aria-label="Main"></nav>
    <main class="main">
      <div>
        <h1>Archive</h1>
        <p class="sub">Every past proposal and dossier. Nothing is deleted automatically.</p>
      </div>

      <div class="row-flex" style="align-items: flex-end;">
        <div class="field spacer">
          <label for="q">Search by title, COM number, or tag</label>
          <input id="q" type="search" placeholder="energy">
        </div>
        <div class="field">
          <label for="from">From</label>
          <input id="from" type="date">
        </div>
        <div class="field">
          <label for="to">To</label>
          <input id="to" type="date">
        </div>
      </div>

      <div class="chips" id="chips"></div>

      <div class="card">
        <div class="list-head archive-cols">
          <span>Week of</span><span>Alignment</span><span>Proposal</span><span>Rating</span><span>Tags</span><span>Emailed</span>
        </div>
        <div id="rows"></div>
      </div>
    </main>
  </div>

  <script>
    var rows = PXR.archiveRows;
    var filter = 'all';
    var q = '';

    function renderChips() {
      var chips = [['all', 'All alignments'], ['int', 'Intervene'], ['mon', 'Monitor'], ['fav', 'Favorable'], ['none', 'No impact']];
      document.getElementById('chips').innerHTML = chips.map(function (c) {
        return '<button type="button" class="chip' + (filter === c[0] ? ' on' : '') + '" data-filter="' + c[0] + '" aria-pressed="' + (filter === c[0]) + '">' + c[1] + '</button>';
      }).join('');
    }

    function renderRows() {
      var needle = q.trim().toLowerCase();
      var shown = rows
        .filter(function (r) { return filter === 'all' || r.flag === filter; })
        .filter(function (r) { return !needle || (r.title + ' ' + r.tags).toLowerCase().indexOf(needle) >= 0; });
      document.getElementById('rows').innerHTML = shown.length ? shown.map(function (r) {
        return '<a class="list-row archive-cols" href="dossier.html">' +
          '<span>' + PXR.esc(r.week) + '</span>' +
          '<span>' + PXR.flag(r.flag) + '</span>' +
          '<span class="row-title">' + PXR.esc(r.title) + '</span>' +
          '<span class="row-rating">' + PXR.rating(r.rating) + '</span>' +
          '<span class="muted">' + PXR.esc(r.tags) + '</span>' +
          '<span>' + PXR.esc(r.emailed) + '</span>' +
          '</a>';
      }).join('') : '<div class="empty">No dossiers match. Try another search term or choose All alignments.</div>';
      PXR.refresh();
    }

    document.getElementById('chips').addEventListener('click', function (e) {
      var b = e.target.closest('[data-filter]');
      if (!b) return;
      filter = b.getAttribute('data-filter');
      renderChips();
      renderRows();
    });
    document.getElementById('q').addEventListener('input', function (e) {
      q = e.target.value;
      renderRows();
    });
    document.addEventListener('DOMContentLoaded', function () {
      renderChips();
      renderRows();
    });
  </script>
</body>
</html>
